# GHCR 镜像发布：ghcr.io/weidu12123/liyuan
# - 打 v* tag 自动触发；手动 workflow_dispatch 随时可发
# - 镜像 tag 取 package.json 版号（与 Release 对齐）＋ latest
# - 双架构 linux/amd64 + linux/arm64（QEMU；依赖全纯 JS，无原生编译）
# - ⚠ 包首次创建默认 private：发布后在 GitHub → Packages → liyuan →
#   Danger Zone 把可见性改为 Public（一次性操作），否则匿名 docker pull 401
name: docker

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: build & push (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR 要求镜像名全小写（仓库名 Liyuan 含大写 L）
      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 版号取 package.json：tag 推送与手动触发同一条规则
      - name: Version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 冒烟：把刚推的镜像按用户的 compose 路径拉起来探活（镜像私有也要能验——
  # 用 GITHUB_TOKEN 登录拉取，不依赖可见性）。与 desktop.yml 的 AppImage 冒烟同款。
  smoke:
    name: smoke (pull & probe)
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # deploy/compose.ghcr.yml 即文档里用户 curl 的那份：相对路径 ./data 落在 compose 文件旁
      - name: Pull and up (compose.ghcr.yml)
        run: docker compose -f deploy/compose.ghcr.yml up -d --wait --wait-timeout 300

      - name: HTTP probe
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7620/)
          test "$code" = 200 || { echo "GET / -> $code"; exit 1; }

      - name: Config seeded as real files
        run: |
          test -f deploy/data/config/liyuan.config.json
          test -f deploy/data/config/liyuan.agent.json
          test -f deploy/data/cards/default_Qingwu.json
          test -n "$(find deploy/data/card-spaces -name default_Qingwu.json | head -1)"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose.ghcr.yml logs --tail=200
